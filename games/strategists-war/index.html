    <style>
      html:root,body{background:#1d130c}
      .rts-boot{box-sizing:border-box;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;

      .rts-boot-card{margin:0;padding:10px 26px;display:flex;flex-direction:column;align-items:center;gap:2px;

        box-shadow:0 4px 12px #000a;font-weight:700;letter-spacing:.12em;text-align:center}
      .rts-boot-card span:first-child{font-size:16px}
      .rts-boot-card span+span{font-size:12px;color:#5c4526;letter-spacing:.08em}
      .rts-boot-bar{width:min(240px,64vw);height:6px;border:1px solid #b98d4a;background:#120b07 repeating-linear-gradient(90deg,#0000 0 40px,#d9a94e 40px 90px,#0000 90px 160px) 0 0/160px 100%;
        box-shadow:0 0 0 1px #000a;animation:rts-boot-slide 1.4s linear infinite}
      @keyframes rts-boot-slide{to{background-position:160px 0}}
      @media (prefers-reduced-motion:reduce){.rts-boot-bar{animation:none}}
    </style>
